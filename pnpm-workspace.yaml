packages:
  - packages/*
  - apps/*

# pnpm 10 blocks dependency install scripts unless allowed here.
onlyBuiltDependencies:
  - '@nestjs/core'
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - prisma
  - sharp
  - unrs-resolver

# msgpackr-extract is an optional native speedup for BullMQ; the pure-JS fallback is used.
ignoredBuiltDependencies:
  - msgpackr-extract

# Patched transitive versions for known advisories (see ADR-011).
overrides:
  postcss: '^8.5.33'
  effect: '^3.22.5'
  deepmerge-ts: '^8.0.2'
